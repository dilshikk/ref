# Запуск:   docker compose up -d --build
# Логи:     docker compose logs -f bot
#
# Перед первым запуском на сервере:
#   1) скопируйте .env.example -> .env и заполните (токен, админы, PostgreSQL, ключ шифрования)
#   2) DB_HOST в .env: внутри контейнера "localhost" — это сам контейнер.
#      Если PostgreSQL стоит на этом же сервере, укажите DB_HOST=host.docker.internal
#   3) после запуска задайте группу, денежных админов, тарифы и каналы в админ-панели (/admin)
#
# Все настройки хранятся в базе, отдельных файлов и директорий монтировать не нужно.
# Переезд со старой версии (config/url.yml) — см. README, раздел «Переезд со старой версии».

services:
  bot:
    build: .
    container_name: ref_bot
    # Автоперезапуск после падения и после перезагрузки сервера
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Без ограничения docker logs со временем заполняют диск
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
