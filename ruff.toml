# Проверка кода (#24). Запуск: ruff check .
target-version = "py311"
line-length = 120

[lint]
# Pyflakes: неиспользуемые импорты и переменные, неопределённые имена, f-строки без
# подстановок и т.п. Стилевые правила (E/W) пока не включены: стиль в проекте не единый.
select = ["F"]

[lint.per-file-ignores]
# В __init__.py импорты — это реэкспорт
"__init__.py" = ["F401", "F403", "F405"]
